name: Update Authorized North City Contact Numbers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo-north-contacts-20261102.yml'
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preview, update and verify scoped northern city contacts
        env:
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
        run: python3 scripts/update_north_contacts_20261102.py
