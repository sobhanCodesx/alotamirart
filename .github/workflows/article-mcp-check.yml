name: Article MCP and deployment checks
on:
  push:
    paths:
      - 'api/mcp.php'
      - 'app/Support/env.php'
      - 'config/database.php'
      - 'bootstrap/app.php'
      - '.htaccess'
      - '.gitignore'
      - '.env.example'
      - 'tests/env-loader.php'
      - 'tests/mcp-image-payload-contract.php'
      - 'tests/playnexus-mcp-architecture.php'
      - 'api/mcp/index.php'
      - 'scripts/mcp_content_job.py'
      - '.github/workflows/mcp-content-publish.yml'
      - 'api/content-tools.php'
      - 'api/deploy.php'
      - 'scripts/alo_deploy.py'
      - 'scripts/alo_deploy_ftps.py'
      - 'tests/article-mcp-contract.php'
      - 'tests/deploy-contract.php'
      - '.github/workflows/article-mcp-check.yml'
      - '.github/workflows/deploy-alo-production.yml'
  pull_request:
    paths:
      - 'api/mcp.php'
      - 'app/Support/env.php'
      - 'config/database.php'
      - 'bootstrap/app.php'
      - '.htaccess'
      - '.gitignore'
      - '.env.example'
      - 'tests/env-loader.php'
      - 'tests/mcp-image-payload-contract.php'
      - 'tests/playnexus-mcp-architecture.php'
      - 'api/mcp/index.php'
      - 'scripts/mcp_content_job.py'
      - '.github/workflows/mcp-content-publish.yml'
      - 'api/deploy.php'
      - 'scripts/alo_deploy.py'
      - 'scripts/alo_deploy_ftps.py'
      - 'tests/article-mcp-contract.php'
      - 'tests/deploy-contract.php'
      - '.github/workflows/article-mcp-check.yml'
      - '.github/workflows/deploy-alo-production.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate both MCP and deploy agents
        run: |
          php -l api/mcp.php
          php -l api/content-tools.php
          php -l api/deploy.php
          php tests/article-mcp-contract.php
          php tests/deploy-contract.php
          php -l app/Support/env.php
          php -l config/database.php
          php -l bootstrap/app.php
          php tests/env-loader.php
          php tests/mcp-image-payload-contract.php
          php tests/playnexus-mcp-architecture.php
          php -l api/mcp/index.php
          python3 -m py_compile scripts/mcp_content_job.py
          php tests/legacy-compatibility.php
          python3 -m py_compile scripts/alo_deploy.py scripts/alo_deploy_ftps.py
