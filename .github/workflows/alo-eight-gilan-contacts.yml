name: Apply requested eight-city Gilan contacts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo-eight-gilan-contacts.yml'
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preview and apply phone replacements to matching live articles
        env:
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
        run: python3 scripts/update_eight_gilan_city_contacts.py
