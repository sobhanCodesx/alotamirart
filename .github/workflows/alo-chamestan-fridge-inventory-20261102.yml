name: Audit Chamestan Refrigerator Brands in Alo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo-chamestan-fridge-inventory-20261102.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Chamestan refrigerator brands using read-only MCP
        env:
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
        run: python3 scripts/chamestan_refrigerator_inventory_20261102.py
