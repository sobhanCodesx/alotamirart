name: Alo dispenser editorial connection check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/alo-dispenser-preflight-20261022.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read connection and public pages without changes
        env:
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
        run: python3 scripts/alo_dispenser_preflight_20261022.py
