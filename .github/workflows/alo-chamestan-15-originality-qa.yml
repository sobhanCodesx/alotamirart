name: Chamestan 15 Brand SEO Originality Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo-chamestan-15-originality-qa.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect live originality and internal links
        env:
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
        run: python3 -u scripts/chamestan_15_seo_originality_audit_20261102.py
