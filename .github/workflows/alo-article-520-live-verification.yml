name: Verify AloTamiratchi Article 520 Live
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo-article-520-live-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check article, SEO and media on production (read only)
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, re
          from html import unescape
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          ROOT='https://alotamiratchi.ir'
          PATH='/post/520/why-choose-alotamiratchi'
          COVER='/them/admin/dist/img/img-ba0e1bd9b19133f98bf65e411d6f4ce3.webp'
          def get(path,max_bytes=4000000):
              req=Request(ROOT+path,headers={'User-Agent':'AloCityEditorialLiveVerifier/1.0','Accept':'text/html,image/webp'})
              with urlopen(req,timeout=40) as response:
                  body=response.read(max_bytes+1)
                  print('LIVE_FETCH',response.status,path,'BYTES',len(body),'CONTENT_TYPE',response.headers.get('Content-Type','unknown'))
                  if response.status!=200 or len(body)>max_bytes: raise RuntimeError('Unexpected live response')
                  return body
          page=get(PATH).decode('utf-8','replace')
          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__();self.h1=0;self.links=[];self.imgs=[];self.canonical=[];self.meta=[];self.og=[];self.title=''
                  self._in_title=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='h1': self.h1+=1
                  if tag=='a' and a.get('href'):self.links.append(a['href'])
                  if tag=='img':self.imgs.append(a.get('src',''))
                  if tag=='link' and 'canonical' in a.get('rel',''):self.canonical.append(a.get('href',''))
                  if tag=='meta' and a.get('name')=='description':self.meta.append(a.get('content',''))
                  if tag=='meta' and a.get('property')=='og:image':self.og.append(a.get('content',''))
                  if tag=='title':self._in_title=True
              def handle_data(self,data):
                  if self._in_title:self.title+=data
              def handle_endtag(self,tag):
                  if tag=='title':self._in_title=False
          p=Checker();p.feed(page)
          assert p.h1==1, ('H1 count',p.h1)
          assert 'چرا الو تعمیراتچی را انتخاب کنیم' in unescape(page),'Missing expected article text'
          assert 'چرا الو تعمیراتچی را انتخاب کنیم' in unescape(p.title),'Missing search title'
          assert p.canonical and p.canonical[0].rstrip('/')==ROOT+PATH,('Bad canonical',p.canonical)
          assert p.meta and len(p.meta[0].strip())>40,('Missing meta description',p.meta)
          for target in ('https://alotamiratchi.ir/post/516/','https://alotamiratchi.ir/post/519/','https://tekanino.ir/','https://khadamatrad.ir/'):
              assert any(x.startswith(target) for x in p.links),('Missing contextual link',target)
          assert any(COVER in src for src in p.imgs),('Missing featured image',len(p.imgs))
          data_images=[src for src in p.imgs if src.startswith('data:image/webp;base64,')]
          assert data_images,('Inline article WebP not found',len(p.imgs))
          for src in data_images:
              raw=base64.b64decode(src.split(',',1)[1],validate=True)
              assert raw[0:4]==b'RIFF' and raw[8:12]==b'WEBP'
              assert 5000<len(raw)<=30000,('Inline image wrong size',len(raw))
              print('INLINE_IMAGE_VERIFIED_BYTES',len(raw))
          cover=get(COVER,100000)
          assert cover[:4]==b'RIFF' and cover[8:12]==b'WEBP','Invalid cover format'
          assert 5000<len(cover)<=30000,('Cover bytes outside maximum',len(cover))
          print('COVER_VERIFIED_BYTES',len(cover))
          assert p.og and any(COVER in u for u in p.og),'OG cover mismatch'
          print('ALO_ARTICLE_520_LIVE_VERIFIED_OK', 'links',len(p.links),'images',len(p.imgs),'H1',p.h1)
          PY
