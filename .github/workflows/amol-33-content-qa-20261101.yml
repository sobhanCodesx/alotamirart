name: QA All 33 Amol Refrigerator Brand Guides
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amol-33-content-qa-20261101.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile QA audit script
        run: python3 -m py_compile scripts/amol_33_live_content_qa_20261101.py
      - name: Validate all 33 published brand pages without changing content
        env:
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
        run: python3 scripts/amol_33_live_content_qa_20261101.py
