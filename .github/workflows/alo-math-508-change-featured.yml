name: Set user-selected featured image on Izeh article 508
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo-math-508-change-featured.yml'
permissions:
  contents: read
concurrency:
  group: alotamiratchi-content-publishing
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax check for cover-only action
        run: python3 -m py_compile scripts/alo_math_508_change_featured.py
      - name: Replace image using legacy-compatible title no-op and verify
        env:
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
        run: python3 scripts/alo_math_508_change_featured.py
