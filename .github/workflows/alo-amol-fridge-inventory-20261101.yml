name: Audit Amol Refrigerator Brands in Alo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo-amol-fridge-inventory-20261101.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check published Amol refrigerator articles by brand via read-only MCP
        env:
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
        run: python3 scripts/amol_refrigerator_inventory_20261101.py
