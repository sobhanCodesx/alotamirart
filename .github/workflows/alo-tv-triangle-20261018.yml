name: Verify and publish approved TV article 507
on:
  push:
    branches: [main]
    paths: ['.github/workflows/alo-tv-triangle-20261018.yml']
permissions:
  contents: read
concurrency:
  group: alotamiratchi-content-publishing
  cancel-in-progress: false
jobs:
  article:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile scripts/alo_tv_triangle_20261018.py
      - name: Verify stored TV article and publish same id
        env:
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
        run: python3 scripts/alo_tv_triangle_20261018.py
