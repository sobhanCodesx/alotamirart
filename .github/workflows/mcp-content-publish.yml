name: AloTamiratchi MCP Content Publisher
# PlayNexus-style queue triggers content publication, never site deployment.
on:
  push:
    branches: [main]
    paths:
      - 'content-requests/*.json'
  workflow_dispatch:
    inputs:
      job_path:
        description: 'Previously queued content-requests/*.json job to retry'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alotamiratchi-content-publishing
  cancel-in-progress: false

jobs:
  publish-via-mcp:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install image renderer
        run: python3 -m pip install --quiet pillow
      - name: Validate compressed editorial banners
        run: python3 -m unittest discover -s tests -p 'test_alo_banner.py'
      - name: Validate safe bulk contact updates
        run: python3 -m unittest discover -s tests -p 'test_mcp_mahshahr_contacts.py'
      - name: Publish approved content through authenticated MCP (no deployment)
        env:
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
          QUEUED_JOB: ${{ inputs.job_path }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            mapfile -t NEW_REQUESTS < <(printf '%s\n' "$QUEUED_JOB")
          else
            before="${BEFORE_SHA:-}"
            if ! git rev-parse --verify "$before^{commit}" >/dev/null 2>&1; then
              before="$(git rev-parse HEAD^)"
            fi
            mapfile -t NEW_REQUESTS < <(git diff --diff-filter=AM --name-only "$before" HEAD -- content-requests)
          fi
          if [ "${#NEW_REQUESTS[@]}" -eq 0 ]; then
            echo "No new or modified content request files"
            exit 0
          fi
          for request in "${NEW_REQUESTS[@]}"; do
            case "$request" in
              content-requests/*.json)
                python3 scripts/mcp_content_job.py "$request"
                ;;
              *)
                echo "Ignoring unexpected request path"
                ;;
            esac
          done
