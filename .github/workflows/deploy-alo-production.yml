name: Deploy AloTamirArt Production (PlayNexus Protocol)
# Production deployment must only react to edits to website application files.
# Running the MCP read-only workflow, editing documentation/tests, or publishing
# content via the MCP endpoint does not create a production deployment.
on:
  push:
    branches: [main]
    paths:
      - 'api/**/*.php'
      - 'app/**/*.php'
      - 'bootstrap/**/*.php'
      - 'classes/**/*.php'
      - 'database/**/*.php'
      - 'public/**'
      - 'reqires/**/*.php'
      - 'router/**/*.php'
      - 'them/**'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'images/**'
      - 'img/**'
      - 'fonts/**'
      # Exclude runtime uploads, logs and non-code documentation even if nested.
      - '!**/*.md'
      - '!**/*.txt'
      - '!**/error_log'
      - '!**/upload/**'
      - '!**/uploads/**'
      - '!**/storage/**'
      - '!**/cache/**'
      - '!**/log/**'
      - '!**/logs/**'
      - '!**/vendor/**'
      - '!**/node_modules/**'
permissions:
  contents: read
concurrency:
  group: alotamirart-production
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax and compatibility
        run: |
          php -l api/mcp.php
          php -l api/content-tools.php
          php -l api/deploy.php
          php -l api/deployment-agent/index.php
          php tests/article-mcp-contract.php
          php tests/deploy-contract.php
          php tests/env-loader.php
          python3 -m py_compile scripts/alo_deploy.py scripts/alo_deploy_playnexus.py
          php tests/legacy-compatibility.php
          php tests/admin-panel-contract.php
  production:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: PlayNexus-style staged multipart deployment via HTTPS
        env:
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
          ALO_DEPLOY_AGENT_URL: https://www.alotamiratchi.ir/api/deployment-agent/
          BEFORE_SHA: ${{ github.event.before }}
          ALO_DEPLOY_BASE_SHA: ${{ vars.ALO_DEPLOY_BASE_SHA }}
        run: |
          set -euo pipefail
          if [ -z "${BEFORE_SHA:-}" ]; then
            export BEFORE_SHA="$(git rev-parse HEAD^)"
          fi
          python3 scripts/alo_deploy_playnexus.py
