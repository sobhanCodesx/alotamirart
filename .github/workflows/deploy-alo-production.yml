name: Deploy AloTamirArt Production
# Production deployment must only react to edits to website application files.
# Running the MCP read-only workflow, editing documentation/tests, or publishing
# content via the MCP endpoint does not create a production deployment.
on:
  push:
    branches: [main]
    paths:
      - 'api/**/*.php'
      - 'app/**/*.php'
      - 'bootstrap/**/*.php'
      - 'classes/**/*.php'
      - 'database/**/*.php'
      - 'public/**'
      - 'reqires/**/*.php'
      - 'router/**/*.php'
      - 'them/**'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'images/**'
      - 'img/**'
      - 'fonts/**'
      # Exclude runtime uploads, logs and non-code documentation even if nested.
      - '!**/*.md'
      - '!**/*.txt'
      - '!**/error_log'
      - '!**/upload/**'
      - '!**/uploads/**'
      - '!**/storage/**'
      - '!**/cache/**'
      - '!**/log/**'
      - '!**/logs/**'
      - '!**/vendor/**'
      - '!**/node_modules/**'
permissions:
  contents: read
concurrency:
  group: alotamirart-production
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax and compatibility
        run: |
          php -l api/mcp.php
          php -l api/content-tools.php
          php -l api/deploy.php
          php tests/article-mcp-contract.php
          php tests/deploy-contract.php
          php tests/env-loader.php
          python3 -m py_compile scripts/alo_deploy.py
          php tests/legacy-compatibility.php
          php tests/admin-panel-contract.php
  production:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Upload signed changes over HTTPS
        env:
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
          ALO_DEPLOY_URL: ${{ secrets.ALO_DEPLOY_URL || 'https://alotamiratchi.ir/api/deploy.php' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # One-time re-sync of the MCP code changes that failed to reach cPanel.
          # The signed receiver still enforces its strict per-file allowlist.
          export BEFORE_SHA="1ff56365d60718ad836b3076ac27edb91d27bcce"
          python3 scripts/alo_deploy.py
