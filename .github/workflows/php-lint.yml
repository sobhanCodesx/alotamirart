name: PHP Lint

on:
  push:
    branches:
      - architecture/shared-hosting-v2
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint application PHP
        run: |
          set -e
          find app bootstrap config routes -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l index.php
          php -l service-city.php
          php -l show-city.php
      - name: Router smoke tests
        run: php tests/router-smoke.php
