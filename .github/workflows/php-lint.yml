name: PHP Compatibility Checks

on:
  push:
    branches:
      - main
      - safe-compatibility-refactor
  pull_request:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint active legacy runtime
        run: |
          set -e
          php -l index.php
          php -l dev-router.php
          php -l config/database.php
          php -l database/DataBase.php
          php -l city-services.php
          php -l service-city.php
          php -l service-washing-machine.php
          php -l show-city.php
          find classes router -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Lint public and user panel templates
        run: |
          set -e
          php -l 404.php
          find them/app them/panel -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify compatibility contract
        run: php tests/legacy-compatibility.php
      - name: Verify legacy route contract
        run: php tests/legacy-route-contract.php
      - name: Verify admin panel contract
        run: php tests/admin-panel-contract.php
      - name: Lint migration architecture
        run: |
          set -e
          find app bootstrap routes -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Router smoke tests for migration layer
        run: php tests/router-smoke.php
